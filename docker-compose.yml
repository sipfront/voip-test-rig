# voip-test-rig — full stack across two networks.
#
#   external (172.30.10.0/24): agents (launched separately), kamailio sig leg,
#                              rtpengine ext media leg, webapp
#   internal (172.30.20.0/24): kamailio int leg, asterisk, rtpengine int media
#                              leg + ng-control, mysql
#
# Service IPs are FIXED and must match kamailio/kamailio.cfg,
# rtpengine/rtpengine.conf, and the SANs in certs/gen-certs.sh.

services:
  mysql:
    image: mysql:${MYSQL_TAG:-8}
    # MySQL 8.4 ships mysql_native_password unloaded; re-enable it so the jambonz
    # `jambones` user (created WITH mysql_native_password) works and the jambonz
    # mysql2 client authenticates without caching_sha2 public-key retrieval.
    command: ["--mysql-native-password=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rigrootpw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kamailio}
      MYSQL_USER: ${MYSQL_USER:-kamailio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kamailiopw}
    volumes:
      - ./kamailio/initdb.d:/docker-entrypoint-initdb.d:ro
    networks:
      internal:
        ipv4_address: 172.30.20.40
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-rigrootpw}"]
      interval: 5s
      timeout: 3s
      retries: 30

  kamailio:
    build:
      context: ./kamailio
      args:
        DEBIAN_TAG: ${DEBIAN_TAG:-stable-slim}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./certs/out:/rig-certs:ro
    networks:
      external:
        ipv4_address: 172.30.10.10
        # Resolvable, cert-valid FQDN for in-rig clients (e.g. the WebRTC browser
        # agent's WSS endpoint wss://kamailio.rig.local:8443). Matches the cert SAN.
        aliases:
          - kamailio.rig.local
      internal:
        ipv4_address: 172.30.20.10
    # Published for optional local dev (a host softphone / browser). Not used in CI.
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5061:5061/tcp"
      - "8443:8443/tcp"

  rtpengine:
    build:
      context: ./rtpengine
      args:
        DEBIAN_TAG: ${DEBIAN_TAG:-stable-slim}
    networks:
      external:
        ipv4_address: 172.30.10.20
      internal:
        ipv4_address: 172.30.20.20
    ports:
      - "30000-30100:30000-30100/udp"

  asterisk:
    build:
      context: ./asterisk
      args:
        # bullseye, not the global trixie tag: Debian only ships the asterisk
        # daemon up to bullseye (removed in bookworm+).
        DEBIAN_TAG: ${ASTERISK_DEBIAN_TAG:-bullseye-slim}
    networks:
      internal:
        ipv4_address: 172.30.20.30

  webapp:
    build:
      context: ./webapp
      args:
        NGINX_TAG: ${NGINX_TAG:-alpine}
    volumes:
      - ./certs/out:/rig-certs:ro
    networks:
      external:
        ipv4_address: 172.30.10.50
        # Resolvable, cert-valid FQDN for the WebRTC browser agent's browser_url
        # (https://webapp.rig.local/). Matches the cert SAN.
        aliases:
          - webapp.rig.local
    ports:
      - "8081:443"

  # ---- jambonz Voice-AI sub-stack ------------------------------------------
  # Dialing user "voicebot" is routed here by Kamailio (route[TOJAMBONZ]). jambonz
  # answers and bridges the call to the OpenAI Realtime API via the voicebot app.
  # Internal-net only, plain SIP/UDP; provisioned from the seeded `jambones` DB
  # (kamailio/initdb.d/30-,31-). Two drachtio instances are required (one per app).
  # jambonz images are amd64-only -> run under emulation on arm64 (no-op on amd64 CI).
  #
  # OPT-IN via the "voicebot" compose profile: the default rig (`make run`, CI) stays
  # lean and does NOT start these. Bring them up with `make voicebot` (or
  # `docker compose --profile voicebot up -d`). Needs OPENAI_API_KEY in .env.
  redis:
    image: redis:${REDIS_TAG:-7-alpine}
    profiles: ["voicebot"]
    networks:
      internal:
        ipv4_address: 172.30.20.53

  jambonz-rtpengine:
    image: drachtio/rtpengine:${JAMBONZ_RTPENGINE_TAG:-latest}
    platform: ${JAMBONZ_PLATFORM:-linux/amd64}
    profiles: ["voicebot"]
    command: >-
      rtpengine --interface=172.30.20.51 --listen-ng=22222
      --foreground=true --log-stderr=true --log-level=5
      --port-min=23000 --port-max=23100 --table=-1
    networks:
      internal:
        ipv4_address: 172.30.20.51

  freeswitch:
    # NOTE: must be a jambonz-capable FreeSWITCH (mod_audio_fork/stream etc.) for the
    # llm/OpenAI-Realtime S2S verb; pin to the tag matching the feature-server version.
    image: drachtio/drachtio-freeswitch-mrf:${JAMBONZ_FS_TAG:-latest}
    platform: ${JAMBONZ_PLATFORM:-linux/amd64}
    profiles: ["voicebot"]
    command: freeswitch --rtp-range-start 25000 --rtp-range-end 25100
    networks:
      internal:
        ipv4_address: 172.30.20.52

  drachtio-sbc:
    image: drachtio/drachtio-server:${DRACHTIO_TAG:-0.8.26}
    platform: ${JAMBONZ_PLATFORM:-linux/amd64}
    profiles: ["voicebot"]
    command: drachtio --contact "sip:*;transport=udp" --mtu 4096 --address 0.0.0.0 --port 9022 --secret cymru --loglevel info
    networks:
      internal:
        ipv4_address: 172.30.20.50

  drachtio-fs:
    image: drachtio/drachtio-server:${DRACHTIO_TAG:-0.8.26}
    platform: ${JAMBONZ_PLATFORM:-linux/amd64}
    profiles: ["voicebot"]
    command: drachtio --contact "sip:*;transport=udp" --mtu 4096 --address 0.0.0.0 --port 9022 --secret cymru --loglevel info
    networks:
      internal:
        ipv4_address: 172.30.20.54

  sbc-inbound:
    image: jambonz/sbc-inbound:${JAMBONZ_SBC_TAG:-0.9.7}
    platform: ${JAMBONZ_PLATFORM:-linux/amd64}
    profiles: ["voicebot"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DRACHTIO_HOST: drachtio-sbc
      DRACHTIO_PORT: "9022"
      DRACHTIO_SECRET: cymru
      JAMBONES_MYSQL_HOST: mysql
      JAMBONES_MYSQL_USER: jambones
      JAMBONES_MYSQL_PASSWORD: jambones
      JAMBONES_MYSQL_DATABASE: jambones
      JAMBONES_REDIS_HOST: redis
      JAMBONES_REDIS_PORT: "6379"
      JAMBONES_RTPENGINES: 172.30.20.51:22222
      # Required at init by @jambonz/time-series; no InfluxDB here, writes are
      # tolerated/ignored at runtime. Just needs to be set.
      JAMBONES_TIME_SERIES_HOST: 127.0.0.1
      JAMBONES_NETWORK_CIDR: ${INTERNAL_SUPERNET:-172.30.0.0/16}
      ENCRYPTION_SECRET: ${JAMBONZ_ENCRYPTION_SECRET:-rig-not-a-secret}
      JWT_SECRET: ${JAMBONZ_ENCRYPTION_SECRET:-rig-not-a-secret}
      JAMBONES_LOGLEVEL: info
    networks:
      internal:
        ipv4_address: 172.30.20.55

  feature-server:
    image: jambonz/feature-server:${JAMBONZ_FS_SERVER_TAG:-10.2.2}
    platform: ${JAMBONZ_PLATFORM:-linux/amd64}
    profiles: ["voicebot"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DRACHTIO_HOST: drachtio-fs
      DRACHTIO_PORT: "9022"
      DRACHTIO_SECRET: cymru
      JAMBONES_FREESWITCH: 172.30.20.52:8021:JambonzR0ck$
      JAMBONES_SBCS: 172.30.20.50
      # Required at init by @jambonz/time-series (no InfluxDB here; writes ignored).
      JAMBONES_TIME_SERIES_HOST: 127.0.0.1
      JAMBONES_MYSQL_HOST: mysql
      JAMBONES_MYSQL_USER: jambones
      JAMBONES_MYSQL_PASSWORD: jambones
      JAMBONES_MYSQL_DATABASE: jambones
      JAMBONES_REDIS_HOST: redis
      JAMBONES_REDIS_PORT: "6379"
      JAMBONES_NETWORK_CIDR: ${INTERNAL_SUPERNET:-172.30.0.0/16}
      ENCRYPTION_SECRET: ${JAMBONZ_ENCRYPTION_SECRET:-rig-not-a-secret}
      HTTP_PORT: "3000"
      JAMBONES_LOGLEVEL: info
    networks:
      internal:
        ipv4_address: 172.30.20.56

  # The voicebot app the feature-server calls (ws://voicebot:3000/openai-s2s).
  # Bridges the call to OpenAI Realtime; behaviour from voicebot/system-prompt.md.
  voicebot:
    build:
      context: ./voicebot
      args:
        NODE_TAG: ${NODE_TAG:-20-alpine}
    profiles: ["voicebot"]
    depends_on:
      - feature-server
    environment:
      # Switch the Voice-AI backend: openai (OpenAI Realtime) | google (Gemini Live).
      VOICEBOT_VENDOR: ${VOICEBOT_VENDOR:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      WS_PORT: "3000"
      LOGLEVEL: info
    volumes:
      # Live-editable system prompt (read per call) — no rebuild needed to change it.
      - ./voicebot/system-prompt.md:/app/system-prompt.md:ro
    networks:
      internal:
        ipv4_address: 172.30.20.57

  # Non-K8S jambonz has no component that populates sbc-inbound's "active feature
  # server" set (the FS only self-registers under K8S). With our single fixed FS we
  # seed it ourselves: keep the feature-server's drachtio (drachtio-fs, .54) in
  # default:active-fs so sbc-inbound routes voicebot calls to it. Re-applied on a
  # loop in case redis is flushed.
  fs-register:
    image: redis:${REDIS_TAG:-7-alpine}
    profiles: ["voicebot"]
    depends_on:
      - redis
    command: ["sh","-c","while true; do redis-cli -h redis SADD default:active-fs 172.30.20.54 >/dev/null 2>&1; sleep 15; done"]
    networks:
      internal:
        ipv4_address: 172.30.20.58

networks:
  external:
    name: rig-external
    ipam:
      config:
        - subnet: ${EXTERNAL_SUBNET:-172.30.10.0/24}
  internal:
    name: rig-internal
    ipam:
      config:
        - subnet: ${INTERNAL_SUBNET:-172.30.20.0/24}
