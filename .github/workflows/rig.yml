name: VoIP rig CI

# Edit any config (kamailio.cfg, rtpengine.conf, asterisk/*, webapp/*, …) and
# push: this stands up the full rig, launches Sipfront agents into it, and runs
# the rig's Sipfront tests against it.
#
# Push only (no pull_request): a PR on a same-repo branch would otherwise trigger
# a second run that the concurrency group cancels, and a cancelled run is
# reported as a failed check on the PR. One run per push keeps the status clean.
on:
  push:
    branches: ["**"]
  workflow_dispatch:        # manual "Run workflow" button
    inputs:
      agent_count:
        description: "Number of Sipfront agents to launch"
        default: "2"

# A new push cancels any still-running run for the same branch (avoids two rigs
# fighting over the same agent pool).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  AGENT_COUNT: ${{ github.event.inputs.agent_count || '2' }}

jobs:
  rig:
    name: Build components, launch test-rig, test with Sipfront
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate on-demand CA + server certs
        run: bash certs/gen-certs.sh

      # --profile voicebot also starts the jambonz Voice-AI stack (drachtio, rtpengine,
      # FreeSWITCH, sbc-inbound, feature-server, redis, voicebot) so "VoiceAI Test: Basic
      # call" has a target. Gemini is the working backend (the public FreeSWITCH image's
      # OpenAI module still speaks the removed Realtime beta shape — see README). Needs
      # the GEMINI_API_KEY repo secret.
      - name: Build and start the rig
        env:
          VOICEBOT_VENDOR: google
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: docker compose --profile voicebot up -d --build

      - name: Wait for the rig to be ready
        run: bash scripts/wait-for-rig.sh

      # All rig containers are up — now launch the agents into the external net.
      - name: Launch Sipfront agents
        env:
          SF_POOL_ID: ${{ secrets.SF_POOL_ID }}
          SF_POOL_SECRET: ${{ secrets.SF_POOL_SECRET }}
        run: bash scripts/launch-agents.sh "${AGENT_COUNT}"

      # Browser (WebRTC) agent: a Selenium Chrome + a sipfront/agent (agent:dev)
      # browser agent in pool-group "webrtc", driving the sip.js webapp.
      - name: Launch WebRTC browser agent
        env:
          SF_POOL_ID: ${{ secrets.SF_POOL_ID }}
          SF_POOL_SECRET: ${{ secrets.SF_POOL_SECRET }}
        run: bash scripts/launch-webrtc-agent.sh

      - name: Settle (let agents connect to the Sipfront cloud)
        run: sleep 25

      # TEMPORARY: run only "VoiceAI Test: Basic call" to shorten the cycle while
      # bringing the jambonz voicebot up in CI. Revert to the full project run by
      # swapping back to: mode: project / project_name: voip-test-rig (and the
      # project-style Report step below).
      - name: Run test — VoiceAI Basic call
        id: project_run
        if: ${{ !cancelled() }}
        uses: sipfront/action-call-test@v1.0.1
        with:
          public_key: ${{ secrets.SF_API_PUBLIC_KEY }}
          secret_key: ${{ secrets.SF_API_SECRET_KEY }}
          sf_environment: dev
          mode: test
          name: "VoiceAI Test: Basic call"
          report_mode: kiosk
          timeout: "3600"

      - name: Report
        if: ${{ !cancelled() }}
        env:
          RUN_STATUS: ${{ steps.project_run.outputs.status }}
          REPORT_URL: ${{ steps.project_run.outputs.report_url }}
          TEST_NAME: ${{ steps.project_run.outputs.test_name }}
          RESULT_DESC: ${{ steps.project_run.outputs.result_description }}
        run: |
          {
            echo "### Sipfront test — ${TEST_NAME:-VoiceAI Test: Basic call}"
            echo "- **status**: ${RUN_STATUS:-n/a} — [report](${REPORT_URL})"
            if [ -n "${RESULT_DESC:-}" ]; then echo "- ${RESULT_DESC}"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect logs
        if: ${{ always() }}
        run: |
          mkdir -p rig-logs
          # --profile voicebot so the jambonz/voicebot service logs are captured too.
          docker compose --profile voicebot logs --no-color > rig-logs/compose.log 2>&1 || true
          for i in $(seq 1 "${AGENT_COUNT}"); do
            docker logs "sf-agent-${i}" > "rig-logs/sf-agent-${i}.log" 2>&1 || true
          done
          docker logs sf-agent-webrtc > rig-logs/sf-agent-webrtc.log 2>&1 || true
          docker logs sf-selenium    > rig-logs/sf-selenium.log    2>&1 || true

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: rig-logs
          path: rig-logs/
          if-no-files-found: ignore

      - name: Tear down
        if: ${{ always() }}
        run: |
          for i in $(seq 1 "${AGENT_COUNT}"); do docker rm -f "sf-agent-${i}" || true; done
          docker rm -f sf-agent-webrtc sf-selenium || true
          docker compose --profile voicebot down -v || true
